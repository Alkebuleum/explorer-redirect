<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>AlkeScan has moved</title>
  <!-- Keep the path, query and hash so old links (e.g. /address/0x…) land on the same page. -->
  <script>
    location.replace("https://alkescan.com" + location.pathname + location.search + location.hash);
  </script>
  <!-- Without JavaScript, at least go to the new home page. -->
  <meta http-equiv="refresh" content="0; url=https://alkescan.com/" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #a9a8b3; font: 15px system-ui, sans-serif; }
    a { color: #c6b6ff; }
  </style>
</head>

<body>
  <p>The Alkebuleum explorer is now <a href="https://alkescan.com/">AlkeScan</a>.</p>
</body>

</html>
